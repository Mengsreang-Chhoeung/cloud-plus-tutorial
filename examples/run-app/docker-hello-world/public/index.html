<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Run App Hello World</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      max-width: 32rem;
      margin: 4rem auto;
      text-align: center;
      background: #ffffff;
      color: #111827;
    }
    button {
      font-size: 1rem;
      padding: 0.5rem 1rem;
      border: none;
      border-radius: 0.375rem;
      color: white;
      cursor: pointer;
    }
    #count {
      font-size: 2rem;
      font-weight: bold;
      margin: 1rem 0;
    }
    #uptime {
      color: #6b7280;
      font-size: 0.875rem;
    }
  </style>
</head>
<body>
  <h1 id="message">Loading…</h1>
  <div id="count">–</div>
  <button id="increment">Visit +1</button>
  <p id="uptime"></p>

  <script>
    async function loadConfig() {
      const res = await fetch("/api/config");
      const { message, accentColor } = await res.json();
      document.getElementById("message").textContent = message;
      document.getElementById("increment").style.backgroundColor = accentColor;
    }

    async function loadCounter() {
      const res = await fetch("/api/counter");
      const { count } = await res.json();
      document.getElementById("count").textContent = count;
    }

    async function loadHealth() {
      const res = await fetch("/health");
      const { uptimeSeconds } = await res.json();
      document.getElementById("uptime").textContent =
        `Server uptime: ${uptimeSeconds}s (resets on redeploy)`;
    }

    document.getElementById("increment").addEventListener("click", async () => {
      const res = await fetch("/api/counter/increment", { method: "POST" });
      const { count } = await res.json();
      document.getElementById("count").textContent = count;
    });

    loadConfig();
    loadCounter();
    loadHealth();
    setInterval(loadHealth, 5000);
  </script>
</body>
</html>
